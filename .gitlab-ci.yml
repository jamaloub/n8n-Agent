image: mcr.microsoft.com/playwright:v1.64.1-noble

stages:
  - test

variables:
  CI: "true"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

playwright-tests:
  stage: test
  script:
    - npm ci
    - npx playwright test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - playwright-report/
      - test-results/