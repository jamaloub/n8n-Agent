name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec-Datei oder Ordner (leer = alle)"
        required: false
        default: ""
      grep:
        description: "Tag oder Titelmuster (leer = alle)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          SPEC: ${{ inputs.spec }}
          GREP: ${{ inputs.grep }}
        run: |
          ARGS=""
          if [ -n "$GREP" ]; then ARGS="--grep \"$GREP\""; fi
          eval npx playwright test $SPEC $ARGS --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
